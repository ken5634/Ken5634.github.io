<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>视频观看页</title>
  <!-- Video.js播放器 -->
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <style>
    /* 密码弹窗样式 */
    #passwordBox{
      position:fixed;
      inset:0;
      background:#000;
      display:flex;
      justify-content:center;
      align-items:center;
      z-index:999;
    }
    #videoWrap{
      display:none;
    }
  </style>
</head>
<body style="background:#111;margin:0;">
  <!-- 密码输入界面 -->
  <div id="passwordBox">
    <div style="text-align:center">
      <h2 style="color:#fff">请输入访问密码</h2>
      <input type="password" id="pwdInput" placeholder="输入密码" style="padding:8px;font-size:18px;">
      <button onclick="checkPwd()" style="padding:8px 16px;font-size:18px;margin-left:8px;">确认</button>
      <p id="tip" style="color:red"></p >
    </div>
  </div>

  <!-- 视频区域（密码正确才显示） -->
  <div id="videoWrap" style="display:flex;justify-content:center;align-items:center;height:95vh;">
    <video
      id="my-video"
      class="video-js"
      controls
      preload="auto"
      width="900"
      height="500"
      data-setup="{}"
    >
      <source src="https://streamable.com/rr2wmp" type="video/mp4">
    </video>
  </div>

  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  <script>
    const PASSWD = "xueyiqin20040725"; // 修改这里设置你的密码
    let player;

    function checkPwd(){
      const inputVal = document.getElementById('pwdInput').value;
      if(inputVal === PASSWD){
        // 密码正确：隐藏密码框，显示视频
        document.getElementById('passwordBox').style.display = 'none';
        document.getElementById('videoWrap').style.display = 'flex';
        player = videojs('my-video');
      }else{
        document.getElementById('tip').innerText = "密码错误，请重试";
      }
    }

    // 回车提交密码
    document.getElementById('pwdInput').addEventListener('keydown',function(e){
      if(e.key === "Enter") checkPwd();
    })

    // 禁止右键另存为
    document.addEventListener('contextmenu', e=>{
      e.preventDefault();
      return false;
    })
    // 禁止拖拽视频
    document.querySelector('video').addEventListener('dragstart',e=>e.preventDefault())
    // 屏蔽Ctrl+S保存网页
    document.addEventListener('keydown',e=>{
      if(e.ctrlKey && (e.key === 'c' || e.key === 's')){
        e.preventDefault();
      }
    })
  </script>
</body>
</html>
