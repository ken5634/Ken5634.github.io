<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>视频观看页</title>
  <!-- 引入Video.js播放器 -->
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
</head>
<body style="background:#111;display:flex;justify-content:center;align-items:center;height:95vh;margin:0;">
  <video
    id="my-video"
    class="video-js"
    controls
    preload="auto"
    width="900"
    height="500"
    data-setup="{}"
  >
    <source src="https://streamable.com/rr2wmp" type="video/mp4">
  </video>

  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  <script>
    var player = videojs('my-video');

    // 1. 禁止整个页面右键菜单（防止右键另存为视频）
    document.addEventListener('contextmenu', e=>{
      e.preventDefault();
      return false;
    })

    // 2. 禁止拖拽视频
    const videoDom = document.querySelector('video');
    videoDom.addEventListener('dragstart',e=>e.preventDefault())

    // 3. 禁止快捷键复制
    document.addEventListener('keydown',e=>{
      if(e.ctrlKey && (e.key === 'c' || e.key === 's')){
        e.preventDefault();
      }
    })
  </script>
</body>
</html>
